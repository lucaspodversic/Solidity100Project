# Configuración de Foundry para este proyecto.
# Las dependencias (forge-std y OpenZeppelin) se comparten en ../lib para no duplicarlas
# en cada uno de los 29 proyectos del lote DeFi.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=../lib/forge-std/src/",
  "@openzeppelin/contracts/=../lib/openzeppelin-contracts/contracts/",
]

[fuzz]
runs = 256
